# .github/workflows klasöründe yeni dosya: daily_video.yml
# İçeriği yapıştır:

# .github/workflows/daily_video.yml
# ====================
name: 🎬 Daily AI Video Generator

on:
  # Run daily at 10:00 UTC
  schedule:
    - cron: '0 10 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: Specific topic for today'
        required: false
        type: string

# Prevent concurrent runs
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Safety timeout
    
    # Only run on public repos (for free minutes)
    if: github.repository_visibility == 'public'
    
    env:
      # Pass secrets to environment
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HF_ZERO_GPU_TOKEN: ${{ secrets.HF_ZERO_GPU_TOKEN }}
      LEONARDO_API_KEY: ${{ secrets.LEONARDO_API_KEY }}
    
    steps:
      # 1. Checkout code
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      # 2. Setup Python
      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      # 3. Install system dependencies (CRITICAL for MoviePy)
      - name: 🔧 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
          # Fix ImageMagick policy for MoviePy (Ubuntu 24.04 uses ImageMagick 6)
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true
          
          # Create symlink for 'magick' command (use 'convert' from ImageMagick 6)
          sudo ln -sf /usr/bin/convert /usr/bin/magick || true
          
          # Verify installations
          convert -version
          ffmpeg -version

          
          # Verify installations
          convert -version
          ffmpeg -version
          magick -version
      
      # 4. Install Python dependencies
      - name: 📦 Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Pre-download Piper model to save time
          python -c "from scripts.generate_voice import ensure_piper_model; ensure_piper_model()"
      
      # 5. Run main pipeline
      - name: 🎬 Generate video
        run: python main.py
        env:
          # Pass workflow input if provided
          TOPIC_OVERRIDE: ${{ inputs.topic }}
      
      # 6. Upload video as artifact (7-day retention)
      - name: 💾 Save video artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ github.run_number }}-${{ github.run_attempt }}
          path: output/*.mp4
          retention-days: 7
          if-no-files-found: warn
      
      # 7. Upload logs for debugging
      - name: 📋 Save logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: logs-${{ github.run_number }}
          path: |
            output/*.json
            output/*.txt
          retention-days: 3
      
      # 8. Cleanup old artifacts (prevent 5GB limit)
      - name: 🧹 Cleanup old artifacts
        if: always()
        run: |
          # Install GitHub CLI if not present
          if ! command -v gh &> /dev/null; then
            sudo apt-get install -y gh
          fi
          
          # Delete artifacts older than 7 days
          gh api repos/${{ github.repository }}/actions/artifacts \
            | jq -r '.artifacts[] | select(.created_at < "'$(date -d '7 days ago' -Iseconds)'") | .id' \
            | while read id; do
                echo "🗑️  Deleting artifact $id"
                gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
              done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # 9. Post-completion summary
      - name: 📊 Job summary
        if: always()
        run: |
          echo "## 🎬 AI-KidsTube Autopilot - Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered**: ${{ github.event_name }} by ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          
          if [ -f output/*.mp4 ]; then
            echo "- **Video**: Generated ✅" >> $GITHUB_STEP_SUMMARY
            echo "- **Next**: Check Telegram for download link 📱" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Video**: Not generated ❌" >> $GITHUB_STEP_SUMMARY
            echo "- **Debug**: Check logs artifact 📋" >> $GITHUB_STEP_SUMMARY
          fi
# ====================
